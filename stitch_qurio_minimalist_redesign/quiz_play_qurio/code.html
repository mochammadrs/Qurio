<script>
        // Simple visual interaction script for demonstration
        function selectOption(selectedButton) {
            // Reset all options
            const allOptions = document.querySelectorAll('.option-btn');
            allOptions.forEach(btn => {
                // Reset to default unselected state classes
                btn.className = "option-btn group flex items-center justify-between w-full p-md bg-surface-container-lowest border border-outline-variant/30 rounded-lg text-left transition-all hover:bg-surface-container-low hover:border-outline focus:outline-none pointer-events-none"; // Disable further clicks for demo
                
                const letterBadge = btn.querySelector('span:first-child');
                letterBadge.className = "flex items-center justify-center w-8 h-8 rounded-full border border-outline-variant text-on-surface-variant font-label-sm transition-colors";
                
                const textSpan = btn.querySelector('span:nth-child(2)');
                textSpan.className = "font-body-lg text-body-lg text-on-surface";

                const icon = btn.querySelector('.material-symbols-outlined');
                icon.className = "material-symbols-outlined text-outline-variant/0 transition-all";
                icon.innerText = "radio_button_unchecked";
                icon.style.fontVariationSettings = "'FILL' 0";
            });

            // Set selected option (Assume it's wrong for demo unless it's the specific correct one)
            // For this static demo, we will force the correct one to show correct, and the selected one to show wrong if it wasn't the correct one.
            
            const isCorrectOption = selectedButton.id === 'correct-option';
            
            if(!isCorrectOption) {
                // Style selected (wrong)
                selectedButton.className = "option-btn group flex items-center justify-between w-full p-md bg-error-container/20 border-2 border-error rounded-lg text-left transition-all focus:outline-none pointer-events-none";
                const letterBadge = selectedButton.querySelector('span:first-child');
                letterBadge.className = "flex items-center justify-center w-8 h-8 rounded-full bg-error text-on-error font-label-sm";
                const icon = selectedButton.querySelector('.material-symbols-outlined');
                icon.className = "material-symbols-outlined text-error";
                icon.innerText = "cancel";
                icon.style.fontVariationSettings = "'FILL' 1";
            }

            // Always highlight the correct one
            const correctBtn = document.getElementById('correct-option');
            correctBtn.className = "option-btn group flex items-center justify-between w-full p-md bg-primary/5 border-2 border-primary rounded-lg text-left transition-all focus:outline-none pointer-events-none";
            const correctLetterBadge = correctBtn.querySelector('span:first-child');
            correctLetterBadge.className = "flex items-center justify-center w-8 h-8 rounded-full bg-primary text-on-primary font-label-sm";
            const correctTextSpan = correctBtn.querySelector('span:nth-child(2)');
            correctTextSpan.className = "font-body-lg text-body-lg text-on-surface font-medium";
            const correctIcon = correctBtn.querySelector('.material-symbols-outlined');
            correctIcon.className = "material-symbols-outlined text-primary";
            correctIcon.innerText = "check_circle";
            correctIcon.style.fontVariationSettings = "'FILL' 1";

            // Show Lanjut button
            document.getElementById('action-area').style.opacity = '1';
        }
    </script>
